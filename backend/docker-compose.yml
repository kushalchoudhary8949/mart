version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vrindawan_mart_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: vrindawan_mart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vrindawan_mart_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vrindawan_mart_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - API_VERSION=v1
      - DATABASE_URL=postgresql://postgres:postgres_password@postgres:5432/vrindawan_mart?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_ACCESS_SECRET=d824d5cf347076a086082a5c5ea772cc85db4f3ba42416ee3c2b8c9b3c4375b6
      - JWT_REFRESH_SECRET=7f5da970dcd1e1d03cf1c3ab32bc9dfb7d8d21cbf3ba895ce4ab5c8d0cde4db2
      - JWT_ACCESS_EXPIRATION=15m
      - JWT_REFRESH_EXPIRATION=7d
      - CORS_ORIGIN=http://localhost:5173
      - RATE_LIMIT_MAX=100
      - RATE_LIMIT_WINDOW_MS=900000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
